<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="c-cpp-profi: the plug-and-play C/C++ pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13203b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a73"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.6" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="900" height="260" rx="22" fill="url(#bg)"/>

  <!-- ===== mascot: a friendly systems-bot (vector only; spans x 46..150) ===== -->
  <g transform="translate(72,78)">
    <line x1="56" y1="4" x2="56" y2="-16" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="-22" r="8" fill="url(#coral)"/>
    <rect x="-8" y="44" width="12" height="26" rx="6" fill="#1f2d4d"/>
    <rect x="108" y="44" width="12" height="26" rx="6" fill="#1f2d4d"/>
    <rect x="2" y="4" width="108" height="100" rx="26" fill="#0f1b33" stroke="url(#teal)" stroke-width="5"/>
    <circle cx="40" cy="48" r="13" fill="url(#teal)"/>
    <circle cx="74" cy="48" r="13" fill="url(#coral)"/>
    <circle cx="44" cy="44" r="4" fill="#0b1220"/>
    <circle cx="78" cy="44" r="4" fill="#0b1220"/>
    <path d="M38 78 Q56 94 74 78" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(112,82) rotate(38)">
      <rect x="0" y="0" width="32" height="9" rx="4.5" fill="#9fb3d1"/>
      <circle cx="2" cy="4.5" r="9" fill="none" stroke="#9fb3d1" stroke-width="5"/>
    </g>
  </g>

  <!-- ===== text block (textLength locks each line to a fixed width so it CANNOT
       overflow regardless of the viewer's font; all end well before the badge at x800) ===== -->
  <text x="244" y="116" font-size="54" font-weight="800" fill="url(#wordmark)"
        textLength="322" lengthAdjust="spacingAndGlyphs" letter-spacing="-1">c-cpp-profi</text>
  <text x="246" y="152" font-size="19" font-weight="600" fill="#cdd9ee"
        textLength="300" lengthAdjust="spacingAndGlyphs">the plug-and-play C / C++ pro</text>
  <text x="246" y="190" font-size="16" font-weight="700"
        textLength="470" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#5eead4">understand</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#5eead4">transform</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#5eead4">improve</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#fda4af">document</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#fda4af">prove</tspan>
  </text>

  <!-- ===== 'prove it' gate badge, vertically centered at the right (x 802..874) ===== -->
  <g transform="translate(838,118)">
    <circle cx="0" cy="0" r="36" fill="#0f1b33" stroke="url(#teal)" stroke-width="4"/>
    <path d="M-16 2 L-4 15 L18 -13" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#9fb3d1"
          textLength="58" lengthAdjust="spacingAndGlyphs">prove it</text>
  </g>
</svg>
