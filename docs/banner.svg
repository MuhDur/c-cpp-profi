<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="c-cpp-profi: the plug-and-play C/C++ pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13203b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a73"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.6" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="900" height="260" rx="22" fill="url(#bg)"/>
  <!-- faint corner dot grid (cool technical texture; well inside the canvas) -->
  <g fill="#9fb3d1" opacity="0.06">
    <circle cx="40" cy="38" r="2"/><circle cx="74" cy="38" r="2"/><circle cx="108" cy="38" r="2"/>
    <circle cx="40" cy="222" r="2"/><circle cx="74" cy="222" r="2"/>
    <circle cx="862" cy="38" r="2"/><circle cx="828" cy="38" r="2"/>
    <circle cx="862" cy="222" r="2"/><circle cx="828" cy="222" r="2"/><circle cx="794" cy="222" r="2"/>
  </g>

  <!-- ===== mascot: a friendly systems-bot (vector only; spans x 44..150) ===== -->
  <g transform="translate(70,74)">
    <line x1="56" y1="4" x2="56" y2="-16" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="-22" r="8" fill="url(#coral)"/>
    <rect x="-8" y="44" width="12" height="26" rx="6" fill="#1f2d4d"/>
    <rect x="108" y="44" width="12" height="26" rx="6" fill="#1f2d4d"/>
    <rect x="2" y="4" width="108" height="104" rx="26" fill="#0f1b33" stroke="url(#teal)" stroke-width="5"/>
    <circle cx="40" cy="50" r="13" fill="url(#teal)"/>
    <circle cx="74" cy="50" r="13" fill="url(#coral)"/>
    <circle cx="44" cy="46" r="4" fill="#0b1220"/>
    <circle cx="78" cy="46" r="4" fill="#0b1220"/>
    <path d="M38 80 Q56 96 74 80" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <!-- little wrench (the 'profi' tooling) -->
    <g transform="translate(112,84) rotate(38)">
      <rect x="0" y="0" width="32" height="9" rx="4.5" fill="#9fb3d1"/>
      <circle cx="2" cy="4.5" r="9" fill="none" stroke="#9fb3d1" stroke-width="5"/>
    </g>
  </g>

  <!-- ===== wordmark + short tagline (left-aligned; ends well before the badge) ===== -->
  <text x="244" y="104" font-size="58" font-weight="800" fill="url(#wordmark)" letter-spacing="-1">c-cpp-profi</text>
  <text x="246" y="140" font-size="20" font-weight="600" fill="#cdd9ee">the plug-and-play C / C++ pro</text>

  <!-- capability line: one dot-separated row, no fixed-width pills (cannot overflow a box) -->
  <text x="246" y="180" font-size="17" font-weight="700">
    <tspan fill="#5eead4">understand</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#5eead4">transform</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#5eead4">improve</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#fda4af">ideate</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#fda4af">document</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#fda4af">prove</tspan>
  </text>

  <!-- subtitle (short; comfortably inside the canvas) -->
  <text x="246" y="212" font-size="14" font-weight="500" fill="#7f93b3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">gate the work · ship the evidence</text>

  <!-- ===== 'prove it' gate badge, top-right (x 800..874) ===== -->
  <g transform="translate(838,76)">
    <circle cx="0" cy="0" r="36" fill="#0f1b33" stroke="url(#teal)" stroke-width="4"/>
    <path d="M-16 2 L-4 15 L18 -13" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#9fb3d1">prove it</text>
  </g>
</svg>
