<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="c-cpp-profi social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13203b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a73"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="0.6" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>
  <rect x="16" y="16" width="1248" height="608" rx="28" fill="none" stroke="#1f2d4d" stroke-width="3"/>

  <!-- ===== mascot (left, vertically centered) — scaled banner bot ===== -->
  <g transform="translate(150,196) scale(2.05)">
    <line x1="56" y1="4" x2="56" y2="-16" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="-22" r="8" fill="url(#coral)"/>
    <rect x="-8" y="44" width="12" height="26" rx="6" fill="#1f2d4d"/>
    <rect x="108" y="44" width="12" height="26" rx="6" fill="#1f2d4d"/>
    <rect x="2" y="4" width="108" height="100" rx="26" fill="#0f1b33" stroke="url(#teal)" stroke-width="5"/>
    <circle cx="40" cy="48" r="13" fill="url(#teal)"/>
    <circle cx="74" cy="48" r="13" fill="url(#coral)"/>
    <circle cx="44" cy="44" r="4" fill="#0b1220"/>
    <circle cx="78" cy="44" r="4" fill="#0b1220"/>
    <path d="M38 78 Q56 94 74 78" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(112,82) rotate(38)">
      <rect x="0" y="0" width="32" height="9" rx="4.5" fill="#9fb3d1"/>
      <circle cx="2" cy="4.5" r="9" fill="none" stroke="#9fb3d1" stroke-width="5"/>
    </g>
  </g>

  <!-- ===== text block (right); textLength locks widths so nothing overflows ===== -->
  <text x="470" y="262" font-size="104" font-weight="800" fill="url(#wm)" letter-spacing="-2"
        textLength="640" lengthAdjust="spacingAndGlyphs">c-cpp-profi</text>
  <text x="474" y="322" font-size="36" font-weight="600" fill="#cdd9ee"
        textLength="540" lengthAdjust="spacingAndGlyphs">the plug-and-play C / C++ pro</text>

  <text x="474" y="398" font-size="30" font-weight="700"
        textLength="700" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#5eead4">understand</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#5eead4">transform</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#5eead4">improve</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#fda4af">document</tspan><tspan fill="#46618c"> · </tspan><tspan fill="#fda4af">prove</tspan>
  </text>

  <text x="474" y="470" font-size="25" font-weight="500" fill="#7f93b3"
        font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        textLength="540" lengthAdjust="spacingAndGlyphs">domain-agnostic · machine-checkable proof</text>

  <!-- ===== 'prove it' badge, bottom-right ===== -->
  <g transform="translate(1130,486)">
    <circle cx="0" cy="0" r="44" fill="#0f1b33" stroke="url(#teal)" stroke-width="5"/>
    <path d="M-20 2 L-5 19 L22 -16" fill="none" stroke="#5eead4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#9fb3d1"
          textLength="76" lengthAdjust="spacingAndGlyphs">prove it</text>
  </g>
</svg>
